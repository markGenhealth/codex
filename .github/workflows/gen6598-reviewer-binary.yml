name: GEN-6598 reviewer binary

on:
  push:
    tags:
      - "gen6598-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Install Linux build dependencies
        working-directory: /
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git libcap-dev libssl-dev pkg-config
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Build Codex CLI
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build --release -p codex-cli --bin codex
      - name: Verify Codex CLI
        run: test "$(target/release/codex --version)" = "codex-cli 0.148.0"
      - name: Package and checksum
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset="codex-reviewer-linux-${ARCH}"
          strip target/release/codex
          install -m 0755 target/release/codex "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-reviewer-linux-${{ matrix.arch }}
          path: |
            codex-rs/codex-reviewer-linux-${{ matrix.arch }}
            codex-rs/codex-reviewer-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  release:
    name: Publish immutable reviewer assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-reviewer-linux-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --title "$TAG" \
            --notes "Pinned Codex 0.148.0 reviewer binary for GEN-6598." \
            dist/codex-reviewer-linux-aarch64 \
            dist/codex-reviewer-linux-x86_64 \
            dist/SHA256SUMS
